name: valen-learning
services:
  valen-learning:
    build: .
    image: valen-learning:3-local
    container_name: valen-learning
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      DATA_DIR: /app/data
      IMPORT_DIR: /app/imports
      FRONTEND_DIST: /app/frontend/dist
      APP_USERNAME: "${APP_USERNAME:-valentin}"
      APP_PASSWORD: "${APP_PASSWORD:?Renseigne APP_PASSWORD dans .env}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      AI_DAILY_LIMIT: "${AI_DAILY_LIMIT:-30}"
      AI_MAX_OUTPUT_TOKENS: "${AI_MAX_OUTPUT_TOKENS:-6000}"
      TZ: Europe/Paris
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./imports
        target: /app/imports
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
